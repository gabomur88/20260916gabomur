name: Mi primer CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  compilacioncita:
    runs-on: ubuntu-latest

    env:
      NOMBRE_USR: ${{ vars.NOMBRE_USR }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}


    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Configurar JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Compilar el proyecto
        run: mvn clean install